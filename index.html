<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>44" Dairy Fan — Click Engineer</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #050607; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #capture-canvas { position: fixed; inset: 0; display: none; z-index: 1; }
    body.hud-hidden #hud { display: none; }

    #captions {
      position: fixed;
      left: 50%;
      bottom: 118px;
      transform: translateX(-50%);
      width: min(920px, 92vw);
      text-align: center;
      color: #eef6fa;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
      pointer-events: none;
      z-index: 5;
    }
    #captions .en { font-size: 26px; font-weight: 600; letter-spacing: 0.3px; }
    #captions .hi { font-size: 19px; opacity: 0.85; margin-top: 4px; }

    #hud {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px 20px;
      z-index: 10;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,26,30,0.72);
      color: #dce8ee;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(40,52,58,0.9); border-color: rgba(255,255,255,0.32); }
    .btn.active { background: #7fafc4; border-color: #7fafc4; color: #08181d; }
    .btn.primary { background: #7fafc4; border-color: #7fafc4; color: #08181d; }
    .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.18); margin: 0 4px; }

    #brand {
      position: fixed;
      top: 18px; left: 22px;
      color: #cfe4ec;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      z-index: 5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    #brand .title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    #brand .sub { font-size: 11px; opacity: 0.65; margin-top: 2px; }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #050607; color: #7fafc4;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px; letter-spacing: 0.5px; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <canvas id="capture-canvas"></canvas>
  <div id="loading">LOADING…</div>
  <div id="brand">
    <div class="title">CLICK ENGINEER</div>
    <div class="sub">44&Prime; Dairy Fan — 0.55 kW · 900 RPM · 50 ft Air Throw</div>
  </div>
  <div id="captions">
    <div class="en" id="cap-en"></div>
    <div class="hi" id="cap-hi"></div>
  </div>
  <div id="hud">
    <button class="btn" data-step="0">1 · Size</button>
    <button class="btn" data-step="1">2 · 360°</button>
    <button class="btn" data-step="2">3 · Motor</button>
    <button class="btn" data-step="3">4 · Air Throw</button>
    <div class="sep"></div>
    <button class="btn primary" id="btn-play">Pause</button>
    <button class="btn" id="btn-replay">Replay</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
